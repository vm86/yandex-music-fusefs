[build-system]
requires = ["setuptools >= 77.0", "setuptools-scm >= 8"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-fuse"
dynamic = ["version"]
description = "Yandex Music Fuse FS"
readme = "README.md"
authors = [{ name = "Roman Nebaluev" }]
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING.LESSER"]
keywords = ["yandex", "music", "fuse", "filesystem", "nfs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Filesystems",
]

dependencies = [
    "yandex-music >=3.0.0",
    "mutagen >=1.47.0",
    "aiohttp >=3.9.0",
    "typing-extensions >=4.6.0",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/vm86/yandex-music-fusefs"
Repository = "https://github.com/vm86/yandex-music-fusefs"
Issues = "https://github.com/vm86/yandex-music-fusefs/issues"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-mock", "coverage", "pytest-cov"]
lint = ["mypy", "ruff"]

[project.scripts]
yamusic-fs = "yandex_fuse.main:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["yandex_fuse", "yandex_fuse.*"]

[tool.setuptools.package-data]
"yandex_fuse" = ["contrib/*"]

[tool.setuptools_scm]
version_file = "yandex_fuse/_version.py"

[tool.pytest.ini_options]
pythonpath = "yandex_fuse"
addopts = "--cov --cov-report term-missing:skip-covered -v -s"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
target-version = "py310"
line-length = 80
indent-width = 4

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/#legend
select = ["ALL"]
# D10* Missing docstring
ignore = [
    "CPY001",
    "D10",
    "D204",
    "D203",
    "D211",
    "D212",
    "D213",
    "EM101",
    "EM102",
    "ERA001",
    "FBT002",
    "FBT003",
    "FIX002",
    "PT001",
    "PT023",
    "PLR0913",
    "Q001",
    "TD003",
    "TRY003",
    "COM812",
    "ISC001",
    "S603",
    "S607",
]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = '^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$'

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
strict = true
pretty = true
